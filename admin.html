<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0a0c15">
    <title>Panel Admin | FG-Studio</title>
    <link rel="icon" type="image/jpeg" href="https://i.ibb.co/LDG7Gf2d/fotor-ai-2025020222510.jpg" id="siteFavicon">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0c15;
            color: #f1f5f9;
            overflow-x: hidden;
        }
        
        .admin-container {
            display: flex;
            min-height: 100vh;
        }
        
        .sidebar {
            width: 280px;
            background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            transition: transform 0.3s ease;
            z-index: 100;
            border-right: 1px solid rgba(45, 212, 191, 0.1);
        }
        
        .sidebar-header {
            padding: 1.5rem;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .sidebar-logo {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            object-fit: cover;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        
        .sidebar-logo:hover {
            border-color: #2dd4bf;
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(45, 212, 191, 0.3);
        }
        
        .sidebar-brand {
            font-family: 'Space Grotesk', monospace;
            font-size: 1.1rem;
            font-weight: 700;
            background: linear-gradient(135deg, #2dd4bf, #3b82f6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-top: 0.75rem;
            cursor: pointer;
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 8px;
        }
        
        .sidebar-brand:hover {
            background: rgba(45, 212, 191, 0.1);
        }
        
        .sidebar-sub {
            font-size: 0.7rem;
            color: #64748b;
            cursor: pointer;
            padding: 0.2rem 0.5rem;
            border-radius: 6px;
            display: inline-block;
        }
        
        .sidebar-sub:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        
        .sidebar-nav {
            padding: 1rem 0;
        }
        
        .nav-section {
            padding: 0.5rem 1rem;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #475569;
            font-weight: 600;
        }
        
        .nav-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.7rem 1.2rem;
            margin: 0.25rem 0.5rem;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            color: #94a3b8;
            font-size: 0.85rem;
            font-weight: 500;
            border-left: 3px solid transparent;
        }
        
        .nav-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #f1f5f9;
        }
        
        .nav-item.active {
            background: rgba(45, 212, 191, 0.1);
            color: #2dd4bf;
            border-left-color: #2dd4bf;
        }
        
        .nav-item i {
            width: 20px;
            font-size: 1rem;
        }
        
        .nav-badge {
            background: #2dd4bf;
            color: #0a0c15;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 700;
            margin-left: auto;
        }
        
        .main-content {
            flex: 1;
            margin-left: 280px;
            padding: 1.5rem;
            min-height: 100vh;
        }
        
        .toolbar {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(45, 212, 191, 0.1);
            border-radius: 16px;
            padding: 0.75rem 1.5rem;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        
        .toolbar h2 {
            font-size: 1.1rem;
            font-weight: 600;
        }
        
        .btn {
            padding: 0.5rem 1rem;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.8rem;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-family: inherit;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #2dd4bf, #14b8a6);
            color: #0a0c15;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(45, 212, 191, 0.3);
        }
        
        .btn-danger {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
        
        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.25);
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #f1f5f9;
        }
        
        .btn-sm {
            padding: 0.25rem 0.7rem;
            font-size: 0.7rem;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        
        .stat-card {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(45, 212, 191, 0.1);
            border-radius: 16px;
            padding: 1.25rem;
            text-align: center;
            transition: all 0.3s;
        }
        
        .stat-card:hover {
            border-color: rgba(45, 212, 191, 0.3);
            transform: translateY(-3px);
        }
        
        .stat-icon {
            font-size: 2rem;
            color: #2dd4bf;
            margin-bottom: 0.5rem;
        }
        
        .stat-number {
            font-size: 2rem;
            font-weight: 800;
            font-family: 'Space Grotesk', monospace;
        }
        
        .stat-label {
            font-size: 0.8rem;
            color: #94a3b8;
        }
        
        .catalogos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1rem;
        }
        
        .catalogo-card {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(45, 212, 191, 0.1);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s;
        }
        
        .catalogo-card:hover {
            border-color: rgba(45, 212, 191, 0.3);
            transform: translateY(-5px);
        }
        
        .catalogo-image {
            width: 100%;
            height: auto;
            aspect-ratio: 300/160;
            object-fit: cover;
        }
        
        .catalogo-info {
            padding: 1rem;
        }
        
        .catalogo-category {
            display: inline-block;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            background: rgba(45, 212, 191, 0.1);
            color: #2dd4bf;
            margin-bottom: 0.5rem;
        }
        
        .catalogo-name {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }
        
        .catalogo-desc {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-bottom: 0.75rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .catalogo-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: #1e293b;
            border: 1px solid rgba(45, 212, 191, 0.2);
            border-radius: 20px;
            width: 100%;
            max-width: 500px;
            max-height: 85vh;
            overflow-y: auto;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.25rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .modal-header h3 {
            font-size: 1rem;
            font-weight: 700;
        }
        
        .modal-body {
            padding: 1.25rem;
        }
        
        .modal-footer {
            padding: 1rem 1.25rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
        }
        
        .form-group {
            margin-bottom: 1rem;
        }
        
        .form-label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 0.25rem;
        }
        
        .form-input {
            width: 100%;
            padding: 0.6rem 0.8rem;
            background: #0f172a;
            border: 1.5px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            color: #f1f5f9;
            font-size: 0.85rem;
            font-family: inherit;
            transition: all 0.2s;
            outline: none;
        }
        
        .form-input:focus {
            border-color: #2dd4bf;
            box-shadow: 0 0 0 3px rgba(45, 212, 191, 0.1);
        }
        
        textarea.form-input {
            resize: vertical;
            min-height: 80px;
        }
        
        .upload-area {
            border: 2px dashed rgba(45, 212, 191, 0.3);
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: rgba(15, 23, 42, 0.5);
        }
        
        .upload-area:hover {
            border-color: #2dd4bf;
            background: rgba(45, 212, 191, 0.05);
        }
        
        .upload-area i {
            font-size: 1.5rem;
            color: #64748b;
            margin-bottom: 0.25rem;
        }
        
        .upload-area p {
            font-size: 0.7rem;
            color: #94a3b8;
        }
        
        .image-preview {
            margin-top: 0.75rem;
            text-align: center;
        }
        
        .image-preview img {
            max-width: 100%;
            max-height: 120px;
            border-radius: 10px;
            border: 1px solid rgba(45, 212, 191, 0.3);
        }
        
        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 0.5rem;
            display: none;
        }
        
        .progress-fill {
            height: 100%;
            background: #2dd4bf;
            width: 0%;
            transition: width 0.3s;
        }
        
        .items-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        
        .item-card {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(45, 212, 191, 0.1);
            border-radius: 12px;
            padding: 0.75rem;
        }
        
        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .item-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: #2dd4bf;
        }
        
        .hero-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 0.75rem;
        }
        
        .hero-card {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 16/9;
            background: #1e293b;
        }
        
        .hero-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s;
        }
        
        .hero-card:hover .hero-overlay {
            opacity: 1;
        }
        
        .add-card {
            border: 2px dashed rgba(45, 212, 191, 0.3);
            border-radius: 12px;
            aspect-ratio: 16/9;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            background: rgba(15, 23, 42, 0.5);
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .add-card:hover {
            border-color: #2dd4bf;
            background: rgba(45, 212, 191, 0.05);
        }
        
        .add-card i {
            font-size: 1.5rem;
            color: #64748b;
        }
        
        .add-card span {
            font-size: 0.7rem;
            color: #94a3b8;
        }
        
        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
        }
        
        .team-card {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(45, 212, 191, 0.1);
            border-radius: 12px;
            overflow: hidden;
        }
        
        .team-image {
            width: 100%;
            height: auto;
            aspect-ratio: 280/180;
            object-fit: cover;
            cursor: pointer;
        }
        
        .team-info {
            padding: 0.75rem;
        }
        
        .team-info div {
            font-size: 0.8rem;
            margin-bottom: 0.25rem;
        }
        
        .toast-container {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 1100;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .toast {
            padding: 0.75rem 1rem;
            border-radius: 10px;
            background: #1e293b;
            border-left: 3px solid;
            transform: translateX(120%);
            transition: transform 0.3s;
            font-size: 0.8rem;
        }
        
        .toast.show {
            transform: translateX(0);
        }
        
        .toast-success {
            border-left-color: #10b981;
        }
        
        .toast-error {
            border-left-color: #ef4444;
        }
        
        .toast-info {
            border-left-color: #3b82f6;
        }
        
        .toast-warning {
            border-left-color: #f59e0b;
        }
        
        .theme-toggle {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #1e293b;
            border: 1px solid rgba(45, 212, 191, 0.2);
            color: #f1f5f9;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            z-index: 90;
        }
        
        .theme-toggle:hover {
            border-color: #2dd4bf;
            transform: scale(1.05);
        }
        
        .menu-toggle {
            display: none;
            position: fixed;
            top: 1rem;
            left: 1rem;
            z-index: 101;
            background: #1e293b;
            border: 1px solid rgba(45, 212, 191, 0.2);
            color: #f1f5f9;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            cursor: pointer;
            align-items: center;
            justify-content: center;
        }
        
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }
            
            .sidebar.open {
                transform: translateX(0);
            }
            
            .main-content {
                margin-left: 0;
                padding: 1rem;
                padding-top: 4rem;
            }
            
            .menu-toggle {
                display: flex;
            }
        }
        
        [data-theme="light"] body {
            background: #f0f4f8;
            color: #0f172a;
        }
        
        [data-theme="light"] .sidebar {
            background: linear-gradient(180deg, #ffffff, #f1f5f9);
        }
        
        [data-theme="light"] .stat-card,
        [data-theme="light"] .catalogo-card,
        [data-theme="light"] .toolbar {
            background: rgba(255, 255, 255, 0.9);
        }
        
        [data-theme="light"] .form-input {
            background: #ffffff;
            color: #0f172a;
        }
        
        [data-theme="light"] .modal-content {
            background: #ffffff;
        }
        
        [data-theme="light"] .item-card {
            background: rgba(255, 255, 255, 0.5);
        }
        
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #64748b;
        }
        
        .empty-state i {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            opacity: 0.4;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }
        
        @media (max-width: 480px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
        
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
    </style>
</head>
<body>
    <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú">
        <i class="fas fa-bars"></i>
    </button>
    
    <div class="admin-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <img class="sidebar-logo" id="sidebarLogo" src="https://i.ibb.co/LDG7Gf2d/fotor-ai-2025020222510.jpg" alt="Logo">
                <div>
                    <div class="sidebar-brand" id="sidebarBrand">FG-Studio</div>
                    <div class="sidebar-sub" id="sidebarSub">Administración</div>
                </div>
            </div>
            <nav class="sidebar-nav" id="sidebarNav"></nav>
        </aside>
        
        <main class="main-content">
            <div class="toolbar">
                <h2 id="pageTitle">Dashboard</h2>
                <button class="btn btn-secondary" id="refreshBtn">
                    <i class="fas fa-sync-alt"></i> Actualizar
                </button>
            </div>
            <div id="pageContent"></div>
        </main>
    </div>
    
    <button class="theme-toggle" id="themeToggle" aria-label="Cambiar tema">
        <i class="fas fa-moon"></i>
    </button>
    
    <div class="toast-container" id="toastContainer"></div>
    
    <script>
        (function() {
            'use strict';
            
            const API = window.location.origin;
            let currentSection = 'dashboard';
            let supabase = null;
            let supabaseReady = false;
            let data = {
                catalogos: [],
                contactos: [],
                pedidos: [],
                acercade: {}
            };
            
            function escapeHtml(str) {
                if (!str) return '';
                return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
            }
            
            function showToast(message, type = 'info') {
                const container = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                toast.className = `toast toast-${type}`;
                const icons = {
                    success: 'fa-check-circle',
                    error: 'fa-times-circle',
                    warning: 'fa-exclamation-triangle',
                    info: 'fa-info-circle'
                };
                toast.innerHTML = `<i class="fas ${icons[type]}"></i> ${message}`;
                container.appendChild(toast);
                setTimeout(() => toast.classList.add('show'), 10);
                setTimeout(() => {
                    toast.classList.remove('show');
                    setTimeout(() => toast.remove(), 300);
                }, 4000);
            }
            
            function initTheme() {
                const saved = localStorage.getItem('fg-theme');
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                const theme = saved || (prefersDark ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
                
                const themeBtn = document.getElementById('themeToggle');
                if (themeBtn) {
                    const icon = themeBtn.querySelector('i');
                    icon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
                    themeBtn.onclick = () => {
                        const current = document.documentElement.getAttribute('data-theme');
                        const next = current === 'dark' ? 'light' : 'dark';
                        document.documentElement.setAttribute('data-theme', next);
                        localStorage.setItem('fg-theme', next);
                        icon.className = next === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
                    };
                }
            }
            
            async function initSupabase() {
                try {
                    const res = await fetch(API + '/api/supabase-config');
                    if (!res.ok) throw new Error('Error fetching config');
                    const config = await res.json();
                    
                    if (config.url && config.anonKey && typeof window.supabase !== 'undefined') {
                        supabase = window.supabase.createClient(config.url, config.anonKey);
                        supabaseReady = true;
                    }
                } catch (error) {
                    console.warn('Supabase init error:', error);
                }
            }
            
            async function uploadImage(file, folder = 'general') {
                if (!supabaseReady || !supabase) {
                    await initSupabase();
                    if (!supabaseReady) {
                        showToast('Servicio de imágenes no disponible', 'error');
                        return null;
                    }
                }
                
                const allowedTypes = ['image/jpeg', 'image/jpg', 'image/png', 'image/webp', 'image/gif'];
                if (!allowedTypes.includes(file.type)) {
                    showToast('Formato no permitido', 'warning');
                    return null;
                }
                
                if (file.size > 2 * 1024 * 1024) {
                    showToast('La imagen no debe superar los 2MB', 'warning');
                    return null;
                }
                
                const ext = file.name.split('.').pop();
                const fileName = `${folder}/${Date.now()}-${Math.random().toString(36).substring(2, 10)}.${ext}`;
                
                try {
                    const { error: uploadError } = await supabase.storage
                        .from('catalogos-imagenes')
                        .upload(fileName, file, {
                            cacheControl: '31536000',
                            upsert: false,
                            contentType: file.type
                        });
                    
                    if (uploadError) throw uploadError;
                    
                    const { data: publicUrlData } = supabase.storage
                        .from('catalogos-imagenes')
                        .getPublicUrl(fileName);
                    
                    showToast('Imagen subida correctamente', 'success');
                    return publicUrlData.publicUrl;
                    
                } catch (error) {
                    showToast('Error al subir imagen', 'error');
                    return null;
                }
            }
            
            function makeEditable(element, currentValue, onSave) {
                element.style.cursor = 'pointer';
                element.title = 'Haz clic para editar';
                element.onclick = (e) => {
                    e.stopPropagation();
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.value = currentValue;
                    input.style.background = '#0f172a';
                    input.style.border = '1px solid #2dd4bf';
                    input.style.borderRadius = '8px';
                    input.style.padding = '0.25rem 0.5rem';
                    input.style.color = '#f1f5f9';
                    input.style.fontFamily = 'inherit';
                    input.style.fontSize = 'inherit';
                    input.style.textAlign = 'center';
                    input.style.outline = 'none';
                    
                    const save = async () => {
                        const newValue = input.value.trim();
                        if (newValue && newValue !== currentValue) {
                            await onSave(newValue);
                        }
                        element.style.display = '';
                        input.remove();
                    };
                    
                    input.onblur = save;
                    input.onkeydown = (e) => {
                        if (e.key === 'Enter') save();
                        if (e.key === 'Escape') input.remove();
                    };
                    
                    element.style.display = 'none';
                    element.parentNode.insertBefore(input, element);
                    input.focus();
                    input.select();
                };
            }

            function showCatalogoModal(cat = null) {
                const isEdit = !!cat;
                let currentImage = cat?.image || '';
                let selectedFile = null;
                
                const modalHtml = `
                    <div class="modal active" id="catalogoModal">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h3>${isEdit ? 'Editar' : 'Agregar'} Catálogo</h3>
                                <button class="btn btn-secondary" id="closeModalBtn"><i class="fas fa-times"></i></button>
                            </div>
                            <div class="modal-body">
                                <div class="form-group"><label class="form-label">Nombre *</label><input type="text" id="catName" class="form-input" value="${escapeHtml(cat?.name || '')}"></div>
                                <div class="form-group"><label class="form-label">Categoría *</label><input type="text" id="catCategory" class="form-input" value="${escapeHtml(cat?.category || '')}"></div>
                                <div class="form-group"><label class="form-label">Enlace *</label><input type="url" id="catLink" class="form-input" value="${escapeHtml(cat?.link || '')}"></div>
                                <div class="form-group">
                                    <label class="form-label">Imagen</label>
                                    <div class="upload-area" id="uploadArea">
                                        <i class="fas fa-cloud-upload-alt"></i>
                                        <p>Haz clic para seleccionar una imagen</p>
                                        <p style="font-size: 0.6rem;">JPG, PNG, WEBP, GIF · Máx 2MB</p>
                                    </div>
                                    <input type="file" id="imageFile" accept="image/*" style="display: none;">
                                    <div class="image-preview" id="imagePreview">
                                        ${currentImage ? `<img src="${escapeHtml(currentImage)}" alt="Preview">` : ''}
                                    </div>
                                    <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
                                </div>
                                <div class="form-group"><label class="form-label">Descripción</label><textarea id="catDesc" class="form-input" rows="3">${escapeHtml(cat?.descripcion || '')}</textarea></div>
                            </div>
                            <div class="modal-footer">
                                <button class="btn btn-secondary" id="cancelModalBtn">Cancelar</button>
                                <button class="btn btn-primary" id="saveCatalogoBtn">Guardar</button>
                            </div>
                        </div>
                    </div>
                `;
                document.body.insertAdjacentHTML('beforeend', modalHtml);
                
                const uploadArea = document.getElementById('uploadArea');
                const fileInput = document.getElementById('imageFile');
                const previewDiv = document.getElementById('imagePreview');
                const progressBar = document.getElementById('progressBar');
                const progressFill = document.getElementById('progressFill');
                
                uploadArea.onclick = () => fileInput.click();
                fileInput.onchange = (e) => {
                    selectedFile = e.target.files[0];
                    if (selectedFile) {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            previewDiv.innerHTML = `<img src="${e.target.result}" alt="Preview">`;
                        };
                        reader.readAsDataURL(selectedFile);
                    }
                };
                
                const closeModal = () => document.getElementById('catalogoModal')?.remove();
                document.getElementById('closeModalBtn')?.addEventListener('click', closeModal);
                document.getElementById('cancelModalBtn')?.addEventListener('click', closeModal);
                
                document.getElementById('saveCatalogoBtn').onclick = async () => {
                    const name = document.getElementById('catName').value.trim();
                    const category = document.getElementById('catCategory').value.trim();
                    const link = document.getElementById('catLink').value.trim();
                    const descripcion = document.getElementById('catDesc').value.trim();
                    
                    if (!name || !category || !link) {
                        showToast('Complete los campos requeridos', 'warning');
                        return;
                    }
                    
                    const saveBtn = document.getElementById('saveCatalogoBtn');
                    saveBtn.disabled = true;
                    saveBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Guardando...';
                    
                    let finalImageUrl = currentImage;
                    
                    if (selectedFile) {
                        progressBar.style.display = 'block';
                        let progress = 0;
                        const interval = setInterval(() => {
                            progress += 10;
                            if (progress <= 90) progressFill.style.width = progress + '%';
                        }, 50);
                        
                        finalImageUrl = await uploadImage(selectedFile, 'catalogos');
                        clearInterval(interval);
                        
                        if (finalImageUrl) {
                            progressFill.style.width = '100%';
                            await new Promise(r => setTimeout(r, 300));
                        } else {
                            progressBar.style.display = 'none';
                            progressFill.style.width = '0%';
                            saveBtn.disabled = false;
                            saveBtn.innerHTML = 'Guardar';
                            return;
                        }
                        progressBar.style.display = 'none';
                        progressFill.style.width = '0%';
                    }
                    
                    if (!finalImageUrl && !isEdit) {
                        showToast('Debe seleccionar una imagen', 'warning');
                        saveBtn.disabled = false;
                        saveBtn.innerHTML = 'Guardar';
                        return;
                    }
                    
                    const url = isEdit ? `${API}/api/catalogos/${cat.id}` : `${API}/api/catalogos`;
                    const method = isEdit ? 'PUT' : 'POST';
                    
                    try {
                        const res = await fetch(url, {
                            method,
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ name, category, link, image: finalImageUrl, descripcion })
                        });
                        if (res.ok) {
                            showToast(isEdit ? 'Actualizado' : 'Agregado', 'success');
                            closeModal();
                            await loadData();
                        } else {
                            showToast('Error al guardar', 'error');
                        }
                    } catch (error) {
                        showToast('Error de conexión', 'error');
                    } finally {
                        saveBtn.disabled = false;
                        saveBtn.innerHTML = 'Guardar';
                    }
                };
            }

            function renderGenericList(container, items, fieldName, labels, keys) {
                let html = `<div style="margin-bottom: 1rem;"><button class="btn btn-primary" id="addItemBtn"><i class="fas fa-plus"></i> Agregar ${labels[0]}</button></div>`;
                
                if (!items.length) {

                } else {

                    items.forEach((item, idx) => {
                        html += `
                            <div class="item-card">

                                    <span class="item-title">#${idx + 1}</span>
                                    <div>
                                        <button class="btn btn-secondary btn-sm edit-item" data-index="${idx}"><i class="fas fa-edit"></i> Editar</button>
                                        <button class="btn btn-danger btn-sm delete-item" data-index="${idx}"><i class="fas fa-trash"></i> Eliminar</button>
                                    </div>
                                </div>
                                <div class="item-body">
                        `;
                        keys.forEach((key, i) => {
                            html += `<div><strong>${labels[i]}:</strong> ${escapeHtml(item[key] || '-')}</div>`;
                        });
                        html += `</div></div>`;
                    });
                    html += `</div>`;
                }
                container.innerHTML = html;
                
                const saveItems = async (newItems) => {
                    await fetch(API + '/api/acercade', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ [fieldName]: newItems })
                    });
                    await loadData();
                    showToast('Guardado correctamente', 'success');
                };
                
                document.getElementById('addItemBtn')?.addEventListener('click', () => {
                    const newItem = {};
                    keys.forEach(key => newItem[key] = '');
                    showItemModal(items, newItem, saveItems, labels, keys, -1);
                });
                
                document.querySelectorAll('.edit-item').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const idx = parseInt(btn.dataset.index);
                        showItemModal(items, { ...items[idx] }, saveItems, labels, keys, idx);
                    });
                });
                
                document.querySelectorAll('.delete-item').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const idx = parseInt(btn.dataset.index);
                        if (confirm('¿Eliminar este elemento?')) {
                            const newItems = items.filter((_, i) => i !== idx);
                            saveItems(newItems);
                        }
                    });
                });
            }
            
            function showItemModal(items, item, saveCallback, labels, keys, editIndex) {
                const isEdit = editIndex >= 0;
                let modalHtml = `
                    <div class="modal active" id="itemModal">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h3>${isEdit ? 'Editar' : 'Agregar'} ${labels[0]}</h3>
                                <button class="btn btn-secondary" id="closeModalBtn"><i class="fas fa-times"></i></button>
                            </div>
                            <div class="modal-body">
                `;
                keys.forEach((key, i) => {
                    modalHtml += `<div class="form-group"><label class="form-label">${labels[i]}</label><input type="text" id="field_${key}" class="form-input" value="${escapeHtml(item[key] || '')}"></div>`;
                });
                modalHtml += `
                            </div>
                            <div class="modal-footer">
                                <button class="btn btn-secondary" id="cancelModalBtn">Cancelar</button>
                                <button class="btn btn-primary" id="saveItemBtn">Guardar</button>
                            </div>
                        </div>
                    </div>
                `;
                document.body.insertAdjacentHTML('beforeend', modalHtml);
                
                const closeModal = () => document.getElementById('itemModal')?.remove();
                document.getElementById('closeModalBtn')?.addEventListener('click', closeModal);
                document.getElementById('cancelModalBtn')?.addEventListener('click', closeModal);
                
                document.getElementById('saveItemBtn').onclick = () => {
                    const newItem = {};
                    keys.forEach(key => {
                        newItem[key] = document.getElementById(`field_${key}`)?.value.trim() || '';
                    });
                    const newItems = [...items];
                    if (isEdit) {
                        newItems[editIndex] = newItem;
                    } else {
                        newItems.push(newItem);
                    }
                    saveCallback(newItems);
                    closeModal();
                };
            }
            
            function renderEquipo(container) {
                const miembros = data.acercade.equipo || [];
                let html = `<div style="margin-bottom: 1rem;"><button class="btn btn-primary" id="addMiembroBtn"><i class="fas fa-plus"></i> Agregar Miembro</button></div>`;
                
                if (!miembros.length) {
                    html += `<div class="empty-state"><i class="fas fa-users"></i><h4>Sin miembros</h4><p>Agrega los miembros del equipo</p></div>`;
                } else {
                    html += `<div class="team-grid">`;
                    miembros.forEach((m, idx) => {
                        html += `
                            <div class="team-card">
                                <img class="team-image" src="${escapeHtml(m.imagen || '')}" alt="${escapeHtml(m.nombre)}" onerror="this.src='https://placehold.co/400x200/1e293b/64748b?text=Sin+imagen'">
                                <div class="team-info">
                                    <div><strong>Nombre:</strong> ${escapeHtml(m.nombre || '-')}</div>
                                    <div><strong>Cargo:</strong> ${escapeHtml(m.cargo || '-')}</div>
                                    <div><strong>Descripción:</strong> ${escapeHtml(m.descripcion || '-')}</div>
                                    ${m.linkedin ? `<div><strong>LinkedIn:</strong> <a href="${escapeHtml(m.linkedin)}" target="_blank">Ver perfil</a></div>` : ''}
                                    ${m.github ? `<div><strong>GitHub:</strong> <a href="${escapeHtml(m.github)}" target="_blank">Ver perfil</a></div>` : ''}
                                    <div style="display: flex; gap: 0.5rem; margin-top: 0.75rem;">
                                        <button class="btn btn-secondary btn-sm edit-miembro" data-index="${idx}"><i class="fas fa-edit"></i> Editar</button>
                                        <button class="btn btn-danger btn-sm delete-miembro" data-index="${idx}"><i class="fas fa-trash"></i> Eliminar</button>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                    html += `</div>`;
                }
                container.innerHTML = html;
                
                const saveEquipo = async (newEquipo) => {
                    await fetch(API + '/api/acercade', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ equipo: newEquipo })
                    });
                    await loadData();
                    showToast('Equipo actualizado', 'success');
                };
                
                document.getElementById('addMiembroBtn')?.addEventListener('click', () => showEquipoModal(miembros, null, saveEquipo));
                document.querySelectorAll('.edit-miembro').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const idx = parseInt(btn.dataset.index);
                        showEquipoModal(miembros, { ...miembros[idx], index: idx }, saveEquipo);
                    });
                });
                document.querySelectorAll('.delete-miembro').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const idx = parseInt(btn.dataset.index);
                        if (confirm('¿Eliminar este miembro?')) {
                            const newEquipo = miembros.filter((_, i) => i !== idx);
                            saveEquipo(newEquipo);
                        }
                    });
                });
                
                document.querySelectorAll('.team-image').forEach((img, idx) => {
                    img.onclick = () => {
                        const input = document.createElement('input');
                        input.type = 'file';
                        input.accept = 'image/*';
                        input.onchange = async (e) => {
                            const file = e.target.files[0];
                            if (!file) return;
                            const url = await uploadImage(file, 'team');
                            if (url) {
                                const newEquipo = [...miembros];
                                newEquipo[idx].imagen = url;
                                await saveEquipo(newEquipo);
                            }
                        };
                        input.click();
                    };
                });
            }
            
            function showEquipoModal(miembros, miembro, saveCallback) {
                const isEdit = !!miembro;
                const editIndex = miembro?.index;
                let currentImage = miembro?.imagen || '';
                let selectedFile = null;
                
                const modalHtml = `
                    <div class="modal active" id="equipoModal">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h3>${isEdit ? 'Editar' : 'Agregar'} Miembro del Equipo</h3>
                                <button class="btn btn-secondary" id="closeModalBtn"><i class="fas fa-times"></i></button>
                            </div>
                            <div class="modal-body">
                                <div class="form-group"><label class="form-label">Nombre *</label><input type="text" id="eqNombre" class="form-input" value="${escapeHtml(miembro?.nombre || '')}"></div>
                                <div class="form-group"><label class="form-label">Cargo</label><input type="text" id="eqCargo" class="form-input" value="${escapeHtml(miembro?.cargo || '')}"></div>
                                <div class="form-group"><label class="form-label">Descripción</label><textarea id="eqDesc" class="form-input" rows="3">${escapeHtml(miembro?.descripcion || '')}</textarea></div>
                                <div class="form-group">
                                    <label class="form-label">Imagen</label>
                                    <div class="upload-area" id="uploadArea">
                                        <i class="fas fa-cloud-upload-alt"></i>
                                        <p>Haz clic para seleccionar una imagen</p>
                                    </div>
                                    <input type="file" id="imageFile" accept="image/*" style="display: none;">
                                    <div class="image-preview" id="imagePreview">
                                        ${currentImage ? `<img src="${escapeHtml(currentImage)}" alt="Preview">` : ''}
                                    </div>
                                    <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
                                </div>
                                <div class="form-row">
                                    <div class="form-group"><label class="form-label">LinkedIn (URL)</label><input type="url" id="eqLinkedin" class="form-input" value="${escapeHtml(miembro?.linkedin || '')}"></div>
                                    <div class="form-group"><label class="form-label">GitHub (URL)</label><input type="url" id="eqGithub" class="form-input" value="${escapeHtml(miembro?.github || '')}"></div>
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button class="btn btn-secondary" id="cancelModalBtn">Cancelar</button>
                                <button class="btn btn-primary" id="saveEquipoBtn">Guardar</button>
                            </div>
                        </div>
                    </div>
                `;
                document.body.insertAdjacentHTML('beforeend', modalHtml);
                
                const uploadArea = document.getElementById('uploadArea');
                const fileInput = document.getElementById('imageFile');
                const previewDiv = document.getElementById('imagePreview');
                const progressBar = document.getElementById('progressBar');
                const progressFill = document.getElementById('progressFill');
                
                uploadArea.onclick = () => fileInput.click();
                fileInput.onchange = (e) => {
                    selectedFile = e.target.files[0];
                    if (selectedFile) {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            previewDiv.innerHTML = `<img src="${e.target.result}" alt="Preview">`;
                        };
                        reader.readAsDataURL(selectedFile);
                    }
                };
                
                const closeModal = () => document.getElementById('equipoModal')?.remove();
                document.getElementById('closeModalBtn')?.addEventListener('click', closeModal);
                document.getElementById('cancelModalBtn')?.addEventListener('click', closeModal);
                
                document.getElementById('saveEquipoBtn').onclick = async () => {
                    const newMiembro = {
                        nombre: document.getElementById('eqNombre')?.value.trim() || '',
                        cargo: document.getElementById('eqCargo')?.value.trim() || '',
                        descripcion: document.getElementById('eqDesc')?.value.trim() || '',
                        linkedin: document.getElementById('eqLinkedin')?.value.trim() || '',
                        github: document.getElementById('eqGithub')?.value.trim() || '',
                        imagen: currentImage
                    };
                    
                    if (!newMiembro.nombre) {
                        showToast('El nombre es requerido', 'warning');
                        return;
                    }
                    
                    const saveBtn = document.getElementById('saveEquipoBtn');
                    saveBtn.disabled = true;
                    saveBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Guardando...';
                    
                    let finalImageUrl = currentImage;
                    
                    if (selectedFile) {
                        progressBar.style.display = 'block';
                        let progress = 0;
                        const interval = setInterval(() => {
                            progress += 10;
                            if (progress <= 90) progressFill.style.width = progress + '%';
                        }, 50);
                        
                        finalImageUrl = await uploadImage(selectedFile, 'team');
                        clearInterval(interval);
                        
                        if (finalImageUrl) {
                            progressFill.style.width = '100%';
                            await new Promise(r => setTimeout(r, 300));
                        } else {
                            progressBar.style.display = 'none';
                            progressFill.style.width = '0%';
                            saveBtn.disabled = false;
                            saveBtn.innerHTML = 'Guardar';
                            return;
                        }
                        progressBar.style.display = 'none';
                        progressFill.style.width = '0%';
                    }
                    
                    newMiembro.imagen = finalImageUrl;
                    
                    let newEquipo = [...miembros];
                    if (isEdit && editIndex !== undefined) {
                        newEquipo[editIndex] = newMiembro;
                    } else {
                        newEquipo.push(newMiembro);
                    }
                    await saveCallback(newEquipo);
                    closeModal();
                    saveBtn.disabled = false;
                    saveBtn.innerHTML = 'Guardar';
                };
            }
            
            function renderContactos(container) {
                let html = `<div class="items-list">`;
                if (!data.contactos.length) {
                    html += `<div class="empty-state"><i class="fas fa-inbox"></i><h4>Sin mensajes</h4></div>`;
                } else {
                    data.contactos.forEach(cont => {
                        html += `
                            <div class="item-card">
                                <div class="item-header">
                                    <span class="item-title">${escapeHtml(cont.nombre)}</span>
                                    <button class="btn btn-danger btn-sm delete-contacto" data-id="${cont.id}"><i class="fas fa-trash"></i> Eliminar</button>
                                </div>
                                <div class="item-body">
                                    <div><strong>Teléfono:</strong> ${escapeHtml(cont.telefono)}</div>
                                    <div><strong>Email:</strong> ${escapeHtml(cont.email || '-')}</div>
                                    <div><strong>Mensaje:</strong> ${escapeHtml(cont.mensaje)}</div>
                                    <div><strong>Fecha:</strong> ${escapeHtml(cont.fecha || '-')}</div>
                                </div>
                            </div>
                        `;
                    });
                }
                html += `</div>`;
                container.innerHTML = html;
                
                document.querySelectorAll('.delete-contacto').forEach(btn => {
                    btn.onclick = async () => {
                        const id = parseInt(btn.dataset.id);
                        if (confirm('¿Eliminar este mensaje?')) {
                            await fetch(`${API}/api/contactos/${id}`, { method: 'DELETE' });
                            showToast('Mensaje eliminado', 'success');
                            await loadData();
                        }
                    };
                });
            }
            
            function renderPedidos(container) {
                let html = `<div class="items-list">`;
                if (!data.pedidos.length) {
                    html += `<div class="empty-state"><i class="fas fa-shopping-bag"></i><h4>Sin pedidos</h4></div>`;
                } else {
                    data.pedidos.forEach(ped => {
                        const estadoClass = ped.estado === 'Completado' ? '#10b981' : ped.estado === 'Cancelado' ? '#ef4444' : '#f59e0b';
                        html += `
                            <div class="item-card">
                                <div class="item-header">
                                    <span class="item-title">Pedido #${ped.id} - ${escapeHtml(ped.cliente)}</span>
                                    <button class="btn btn-danger btn-sm delete-pedido" data-id="${ped.id}"><i class="fas fa-trash"></i> Eliminar</button>
                                </div>
                                <div class="item-body">
                                    <div><strong>Producto:</strong> ${escapeHtml(ped.producto)}</div>
                                    <div><strong>Teléfono:</strong> ${escapeHtml(ped.telefono)}</div>
                                    <div><strong>Detalles:</strong> ${escapeHtml(ped.detalles || '-')}</div>
                                    <div><strong>Estado:</strong> <span style="color: ${estadoClass}">${escapeHtml(ped.estado || 'Pendiente')}</span></div>
                                    <div><strong>Fecha:</strong> ${escapeHtml(ped.fecha || '-')}</div>
                                </div>
                            </div>
                        `;
                    });
                }
                html += `</div>`;
                container.innerHTML = html;
                
                document.querySelectorAll('.delete-pedido').forEach(btn => {
                    btn.onclick = async () => {
                        const id = parseInt(btn.dataset.id);
                        if (confirm('¿Eliminar este pedido?')) {
                            await fetch(`${API}/api/pedidos/${id}`, { method: 'DELETE' });
                            showToast('Pedido eliminado', 'success');
                            await loadData();
                        }
                    };
                });
            }
            
            function initMobileMenu() {
                const menuToggle = document.getElementById('menuToggle');
                const sidebar = document.getElementById('sidebar');
                menuToggle?.addEventListener('click', () => {
                    sidebar?.classList.toggle('open');
                });
            }
            
            function initRefresh() {
                document.getElementById('refreshBtn')?.addEventListener('click', () => {
                    loadData();
                    showToast('Actualizando datos...', 'info');
                });
            }
            
            function init() {
                initTheme();
                initMobileMenu();
                initRefresh();
                checkAuth();
            }
            
            init();
        })();
    </script>
</body>
</html>
