<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0a0c15">
    <title>Panel Admin | FG-Studio</title>
    <link rel="icon" type="image/jpeg" href="https://i.ibb.co/LDG7Gf2d/fotor-ai-2025020222510.jpg" id="siteFavicon">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- SDK de Supabase para subir imágenes -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --pri: #2dd4bf;
            --pri-d: #14b8a6;
            --sec: #3b82f6;
            --bg: #0a0c15;
            --bg2: #111827;
            --card: rgba(17, 24, 39, 0.85);
            --txt: #f1f5f9;
            --txt2: #cbd5e1;
            --dim: #94a3b8;
            --bdr: rgba(45, 212, 191, 0.12);
            --bdr-g: rgba(45, 212, 191, 0.35);
            --inp: rgba(15, 23, 42, 0.85);
            --err: #f87171;
            --ok: #34d399;
            --warn: #fbbf24;
            --r: 14px;
        }
        
        [data-theme="light"] {
            --bg: #f0f4f8;
            --bg2: #e2e8f0;
            --card: rgba(255, 255, 255, 0.9);
            --txt: #0f172a;
            --txt2: #334155;
            --dim: #64748b;
            --bdr: rgba(0, 0, 0, 0.08);
            --bdr-g: rgba(20, 184, 166, 0.3);
            --inp: #ffffff;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--txt);
            line-height: 1.5;
            overflow-x: hidden;
            transition: background 0.3s, color 0.3s;
        }
        
        /* Sidebar */
        .admin-wrapper {
            display: flex;
            min-height: 100vh;
        }
        
        .sidebar {
            width: 280px;
            background: linear-gradient(180deg, #0f172a, #1e293b);
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            z-index: 1000;
            transition: transform 0.3s ease;
            left: 0;
            top: 0;
            border-right: 1px solid var(--bdr);
        }
        
        [data-theme="light"] .sidebar {
            background: linear-gradient(180deg, #1e293b, #334155);
        }
        
        .sidebar.closed {
            transform: translateX(-100%);
        }
        
        .sidebar-header {
            padding: 1.25rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            text-align: center;
        }
        
        .sidebar-logo {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            object-fit: cover;
            cursor: pointer;
            transition: all 0.25s;
            border: 2px solid transparent;
        }
        
        .sidebar-logo:hover {
            border-color: var(--bdr-g);
            transform: scale(1.05);
        }
        
        .sidebar-brand {
            font-family: 'Space Grotesk', monospace;
            font-size: 1rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--pri), var(--sec));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            cursor: pointer;
            display: inline-block;
            margin-top: 0.5rem;
            padding: 0.25rem 0.5rem;
            border-radius: 8px;
            transition: background 0.2s;
        }
        
        .sidebar-brand:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        
        .sidebar-sub {
            color: #64748b;
            font-size: 0.65rem;
            cursor: pointer;
            display: inline-block;
            padding: 0.2rem 0.5rem;
            border-radius: 6px;
            transition: background 0.2s;
        }
        
        .sidebar-sub:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        
        .sidebar-nav {
            padding: 0.75rem 0;
            list-style: none;
        }
        
        .sidebar-section {
            padding: 0.75rem 1rem 0.25rem;
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #475569;
            font-weight: 600;
        }
        
        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.7rem 1rem;
            cursor: pointer;
            transition: all 0.2s;
            color: #94a3b8;
            font-size: 0.85rem;
            border-left: 3px solid transparent;
            background: none;
            width: 100%;
            text-align: left;
            font-family: inherit;
        }
        
        .sidebar-item:hover {
            background: rgba(255, 255, 255, 0.04);
            color: #e2e8f0;
        }
        
        .sidebar-item.active {
            background: rgba(45, 212, 191, 0.08);
            border-left-color: var(--pri);
            color: var(--pri);
        }
        
        .sidebar-item i {
            width: 18px;
            text-align: center;
        }
        
        .sidebar-badge {
            background: var(--pri);
            color: var(--bg);
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 0.6rem;
            font-weight: 700;
            margin-left: auto;
        }
        
        /* Main content */
        .main-content {
            flex: 1;
            margin-left: 280px;
            padding: 1.25rem;
            min-height: 100vh;
            transition: margin-left 0.3s ease;
        }
        
        @media (max-width: 768px) {
            .main-content {
                margin-left: 0;
                padding: 1rem;
                padding-top: 4rem;
            }
            .sidebar {
                transform: translateX(-100%);
            }
            .sidebar.open {
                transform: translateX(0);
            }
        }
        
        /* Toolbar */
        .toolbar {
            background: var(--card);
            backdrop-filter: blur(10px);
            border: 1px solid var(--bdr);
            border-radius: var(--r);
            padding: 0.75rem 1.25rem;
            margin-bottom: 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.75rem;
        }
        
        .toolbar h2 {
            font-size: 1rem;
            font-weight: 600;
            margin: 0;
        }
        
        /* Botones */
        .btn {
            padding: 0.5rem 1rem;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.8rem;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--pri), var(--pri-d));
            color: var(--bg);
        }
        
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(45, 212, 191, 0.3);
        }
        
        .btn-danger {
            background: rgba(248, 113, 113, 0.15);
            color: var(--err);
            border: 1px solid rgba(248, 113, 113, 0.2);
        }
        
        .btn-danger:hover {
            background: rgba(248, 113, 113, 0.25);
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--dim);
            border: 1px solid var(--bdr);
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--txt);
        }
        
        .btn-sm {
            padding: 0.3rem 0.7rem;
            font-size: 0.7rem;
        }
        
        .btn-icon {
            width: 32px;
            height: 32px;
            padding: 0;
            justify-content: center;
        }
        
        /* Tarjetas de contenido */
        .content-card {
            background: var(--card);
            backdrop-filter: blur(10px);
            border: 1px solid var(--bdr);
            border-radius: var(--r);
            padding: 1.25rem;
            margin-bottom: 1rem;
        }
        
        /* Grid de items */
        .items-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        
        .item-card {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--bdr);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.2s;
        }
        
        .item-card:hover {
            border-color: var(--bdr-g);
        }
        
        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1rem;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid var(--bdr);
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        
        .item-header span {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--pri);
        }
        
        .item-body {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }
        
        .form-label {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--txt2);
        }
        
        .form-input {
            padding: 0.6rem 0.8rem;
            background: var(--inp);
            border: 1.5px solid rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            color: var(--txt);
            font-size: 0.85rem;
            font-family: inherit;
            transition: all 0.2s;
            outline: none;
        }
        
        .form-input:focus {
            border-color: var(--pri);
            box-shadow: 0 0 0 3px rgba(45, 212, 191, 0.1);
        }
        
        textarea.form-input {
            resize: vertical;
            min-height: 80px;
        }
        
        /* Grid de dos columnas */
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }
        
        @media (max-width: 640px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
        
        /* Grid de imágenes hero */
        .hero-images-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1rem;
        }
        
        .hero-image-card {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            aspect-ratio: 16/9;
            background: var(--bg-tertiary, #1e293b);
        }
        
        .hero-image-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .hero-image-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s;
            gap: 0.5rem;
        }
        
        .hero-image-card:hover .hero-image-overlay {
            opacity: 1;
        }
        
        .add-image-card {
            border: 2px dashed var(--bdr);
            border-radius: 10px;
            aspect-ratio: 16/9;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            background: rgba(15, 23, 42, 0.4);
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .add-image-card:hover {
            border-color: var(--bdr-g);
            background: rgba(45, 212, 191, 0.05);
        }
        
        .add-image-card i {
            font-size: 1.5rem;
            color: var(--dim);
        }
        
        .add-image-card span {
            font-size: 0.7rem;
            color: var(--dim);
        }
        
        /* Preview de imagen */
        .image-preview {
            margin-top: 0.5rem;
            position: relative;
            display: inline-block;
        }
        
        .image-preview img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid var(--bdr);
        }
        
        .image-preview .remove-preview {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--err);
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.6rem;
            cursor: pointer;
        }
        
        /* Upload area */
        .upload-area {
            border: 2px dashed var(--bdr);
            border-radius: 10px;
            padding: 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: rgba(15, 23, 42, 0.3);
        }
        
        .upload-area:hover {
            border-color: var(--pri);
            background: rgba(45, 212, 191, 0.05);
        }
        
        .upload-area i {
            font-size: 1.5rem;
            color: var(--dim);
            margin-bottom: 0.5rem;
        }
        
        .upload-area p {
            font-size: 0.7rem;
            color: var(--dim);
        }
        
        /* Progress bar */
        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 0.5rem;
            display: none;
        }
        
        .progress-bar-fill {
            height: 100%;
            background: var(--pri);
            width: 0%;
            transition: width 0.3s;
        }
        
        /* Team grid */
        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
        }
        
        .team-card {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--bdr);
            border-radius: 12px;
            overflow: hidden;
        }
        
        .team-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: var(--bg-tertiary, #1e293b);
            cursor: pointer;
        }
        
        .team-info {
            padding: 1rem;
        }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        
        .modal.show {
            display: flex;
        }
        
        .modal-content {
            background: var(--bg2);
            border: 1px solid var(--bdr);
            border-radius: 16px;
            width: 100%;
            max-width: 550px;
            max-height: 85vh;
            overflow-y: auto;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--bdr);
        }
        
        .modal-header h3 {
            font-size: 1rem;
            font-weight: 700;
        }
        
        .modal-body {
            padding: 1.25rem;
        }
        
        .modal-footer {
            padding: 1rem 1.25rem;
            border-top: 1px solid var(--bdr);
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
        }
        
        /* Toast notifications */
        .toast-container {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            pointer-events: none;
        }
        
        .toast {
            padding: 0.75rem 1.25rem;
            border-radius: 10px;
            color: #fff;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transform: translateX(120%);
            transition: transform 0.3s ease;
            pointer-events: auto;
        }
        
        .toast.show {
            transform: translateX(0);
        }
        
        .toast-success { background: #10b981; }
        .toast-error { background: #ef4444; }
        .toast-info { background: #3b82f6; }
        .toast-warning { background: #f59e0b; }
        
        /* Utilidades */
        .empty-state {
            text-align: center;
            padding: 2rem;
            color: var(--dim);
        }
        
        .empty-state i {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            opacity: 0.4;
        }
        
        .menu-toggle {
            position: fixed;
            top: 0.75rem;
            left: 0.75rem;
            z-index: 1100;
            background: var(--bg2);
            border: 1px solid var(--bdr);
            color: var(--txt);
            width: 40px;
            height: 40px;
            border-radius: 10px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
        }
        
        @media (max-width: 768px) {
            .menu-toggle {
                display: flex;
            }
        }
        
        .theme-btn-fixed {
            position: fixed;
            bottom: 1rem;
            right: 1rem;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--card);
            color: var(--txt);
            border: 1px solid var(--bdr);
            cursor: pointer;
            z-index: 99;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        
        .theme-btn-fixed:hover {
            border-color: var(--bdr-g);
        }
        
        /* Editor inline para texto */
        .inline-editor {
            background: var(--inp);
            border: 1px solid var(--pri);
            border-radius: 8px;
            padding: 0.25rem 0.5rem;
            color: var(--txt);
            font-family: inherit;
            font-size: inherit;
            text-align: center;
            outline: none;
        }
        
        .hidden-input {
            display: none;
        }
    </style>
</head>
<body>
    <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú">☰</button>
    <div class="admin-wrapper">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <img class="sidebar-logo" id="sidebarLogo" src="https://i.ibb.co/LDG7Gf2d/fotor-ai-2025020222510.jpg" alt="Logo" style="cursor: pointer;">
                <div>
                    <div class="sidebar-brand" id="sidebarBrand">FG-Studio</div>
                    <div class="sidebar-sub" id="sidebarSub">Administración</div>
                </div>
            </div>
            <nav class="sidebar-nav" id="sidebarNav"></nav>
        </aside>
        
        <main class="main-content" id="mainContent">
            <div class="toolbar">
                <h2 id="pageTitle">Dashboard</h2>
                <button class="btn btn-secondary btn-sm" id="refreshBtn"><i class="fas fa-sync-alt"></i> Actualizar</button>
            </div>
            <div id="pageContent"></div>
        </main>
    </div>
    
    <button class="theme-btn-fixed" id="themeBtn"><i class="fas fa-sun"></i></button>
    <div class="toast-container" id="toastContainer"></div>
    
    <script>
    (function() {
        'use strict';
        
        const API = window.location.origin;
        let currentSection = 'dashboard';
        let data = {
            catalogos: [],
            contactos: [],
            pedidos: [],
            acercade: {}
        };
        
        // Configuración de Supabase para subir imágenes
        let supabase = null;
        let supabaseConfig = null;
        
        // ============================================
        // UTILIDADES
        // ============================================
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            const icon = type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-times-circle' : type === 'warning' ? 'fa-exclamation-triangle' : 'fa-info-circle';
            toast.innerHTML = `<i class="fas ${icon}"></i> ${message}`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }
        
        // ============================================
        // INICIALIZAR SUPABASE PARA SUBIR IMÁGENES
        // ============================================
        async function initSupabase() {
            try {
                const res = await fetch(API + '/api/supabase-config');
                const config = await res.json();
                if (config.url && config.anonKey && typeof supabase !== 'undefined') {
                    supabaseConfig = config;
                    supabase = window.supabase.createClient(config.url, config.anonKey);
                    return true;
                }
            } catch (error) {
                console.error('Error initializing Supabase:', error);
            }
            return false;
        }
        
        // ============================================
        // SUBIR IMAGEN A SUPABASE STORAGE
        // ============================================
        async function uploadImage(file, folder = 'general') {
            if (!supabase) {
                await initSupabase();
                if (!supabase) {
                    showToast('Error: No se pudo conectar con el servicio de imágenes', 'error');
                    return null;
                }
            }
            
            // Validar archivo
            const allowedTypes = ['image/jpeg', 'image/jpg', 'image/png', 'image/webp', 'image/gif'];
            if (!allowedTypes.includes(file.type)) {
                showToast('Formato no permitido. Use JPG, PNG, WEBP o GIF', 'warning');
                return null;
            }
            
            if (file.size > 2 * 1024 * 1024) {
                showToast('La imagen no debe superar los 2MB', 'warning');
                return null;
            }
            
            // Generar nombre único
            const ext = file.name.split('.').pop();
            const fileName = `${folder}/${Date.now()}-${Math.random().toString(36).substring(2, 10)}.${ext}`;
            
            try {
                // Mostrar progreso (simulado)
                const { data: uploadData, error: uploadError } = await supabase.storage
                    .from('catalogos-imagenes')
                    .upload(fileName, file, {
                        cacheControl: '31536000',
                        upsert: false
                    });
                
                if (uploadError) {
                    console.error('Upload error:', uploadError);
                    showToast('Error al subir la imagen', 'error');
                    return null;
                }
                
                // Obtener URL pública
                const { data: publicUrlData } = supabase.storage
                    .from('catalogos-imagenes')
                    .getPublicUrl(fileName);
                
                return publicUrlData.publicUrl;
            } catch (error) {
                console.error('Upload error:', error);
                showToast('Error de conexión al subir', 'error');
                return null;
            }
        }
        
        // ============================================
        // TEMA
        // ============================================
        function initTheme() {
            const saved = localStorage.getItem('fg-theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = saved || (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
            const themeBtn = document.getElementById('themeBtn');
            if (themeBtn) {
                const icon = themeBtn.querySelector('i');
                icon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
                themeBtn.onclick = () => {
                    const current = document.documentElement.getAttribute('data-theme');
                    const next = current === 'dark' ? 'light' : 'dark';
                    document.documentElement.setAttribute('data-theme', next);
                    localStorage.setItem('fg-theme', next);
                    const newIcon = themeBtn.querySelector('i');
                    newIcon.className = next === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
                };
            }
        }
        
        // ============================================
        // EDITAR TEXTO INLINE (LOGO Y SUBTÍTULO)
        // ============================================
        function makeEditable(element, field, currentValue, onSave) {
            element.style.cursor = 'pointer';
            element.title = 'Haz clic para editar';
            
            element.onclick = (e) => {
                e.stopPropagation();
                const input = document.createElement('input');
                input.type = 'text';
                input.value = currentValue;
                input.className = 'inline-editor';
                input.style.width = `${Math.max(element.offsetWidth, 100)}px`;
                
                const save = () => {
                    const newValue = input.value.trim();
                    if (newValue && newValue !== currentValue) {
                        onSave(newValue);
                    }
                    element.style.display = '';
                    input.remove();
                };
                
                input.onblur = save;
                input.onkeydown = (e) => {
                    if (e.key === 'Enter') save();
                    if (e.key === 'Escape') input.remove();
                };
                
                element.style.display = 'none';
                element.parentNode.insertBefore(input, element);
                input.focus();
                input.select();
            };
        }

        // ============================================

        // ============================================
        async function loadData() {
            try {
                const [adminRes, acercadeRes] = await Promise.all([
                    fetch(API + '/api/admin-data'),
                    fetch(API + '/api/acercade')
                ]);
                const adminData = await adminRes.json();
                const acercadeData = await acercadeRes.json();
                data = {
                    catalogos: adminData.catalogos || [],
                    contactos: adminData.contactos || [],
                    pedidos: adminData.pedidos || [],
                    acercade: acercadeData || {}
                };
                
                // Actualizar badges
                document.querySelectorAll('.sidebar-badge').forEach(el => {
                    if (el.id === 'badgeContactos') el.textContent = data.contactos.length;
                    if (el.id === 'badgePedidos') el.textContent = data.pedidos.length;
                    if (el.id === 'badgeCatalogos') el.textContent = data.catalogos.length;
                });
                
                // Actualizar sidebar con datos guardados
                const settings = data.acercade.site_settings || {};
                const logoEl = document.getElementById('sidebarLogo');
                const brandEl = document.getElementById('sidebarBrand');
                const subEl = document.getElementById('sidebarSub');
                if (logoEl && settings.logo) logoEl.src = settings.logo;
                if (brandEl && settings.brand_name) brandEl.textContent = settings.brand_name;
                if (subEl && settings.admin_subtitle) subEl.textContent = settings.admin_subtitle;

        // ============================================
        // MODAL PARA SUBIR IMAGEN (input file)
        // ============================================
        function showImageUploadModal(onSuccess, currentImage = null) {
            let selectedFile = null;
            let previewUrl = null;
            
            const modalHtml = `
                <div class="modal show" id="imageUploadModal">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h3><i class="fas fa-cloud-upload-alt"></i> Subir Imagen</h3>
                            <button class="btn btn-secondary btn-icon" id="closeModalBtn"><i class="fas fa-times"></i></button>
                        </div>
                        <div class="modal-body">
                            ${currentImage ? `<div class="image-preview" id="currentPreview"><img src="${escapeHtml(currentImage)}" alt="Imagen actual"><div class="remove-preview" id="removeCurrentBtn"><i class="fas fa-times"></i></div></div>` : ''}
                            <div class="upload-area" id="uploadArea">
                                <i class="fas fa-cloud-upload-alt"></i>
                                <p>Haz clic o arrastra una imagen</p>
                                <p style="font-size: 0.6rem; margin-top: 0.25rem;">JPG, PNG, WEBP, GIF · Máx 2MB</p>
                            </div>
                            <input type="file" id="imageFileInput" accept="image/*" style="display: none;">
                            <div class="progress-bar" id="progressBar">
                                <div class="progress-bar-fill" id="progressFill"></div>
                            </div>
                            <div id="imagePreview" style="margin-top: 0.75rem; text-align: center;"></div>
                        </div>
                        <div class="modal-footer">
                            <button class="btn btn-secondary" id="cancelModalBtn">Cancelar</button>
                            <button class="btn btn-primary" id="uploadBtn" disabled>Subir y Guardar</button>
                        </div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
            
            const closeModal = () => document.getElementById('imageUploadModal')?.remove();
            const uploadArea = document.getElementById('uploadArea');
            const fileInput = document.getElementById('imageFileInput');
            const uploadBtn = document.getElementById('uploadBtn');
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');
            const previewDiv = document.getElementById('imagePreview');
            
            // Click en el área de upload
            uploadArea.onclick = () => fileInput.click();
            
            // Drag & drop
            uploadArea.ondragover = (e) => {
                e.preventDefault();
                uploadArea.style.borderColor = 'var(--pri)';
                uploadArea.style.background = 'rgba(45, 212, 191, 0.1)';
            };
            uploadArea.ondragleave = () => {
                uploadArea.style.borderColor = 'var(--bdr)';
                uploadArea.style.background = '';
            };
            uploadArea.ondrop = (e) => {
                e.preventDefault();
                uploadArea.style.borderColor = 'var(--bdr)';
                uploadArea.style.background = '';
                const file = e.dataTransfer.files[0];
                if (file) handleFile(file);
            };
            
            // Seleccionar archivo
            fileInput.onchange = (e) => {
                if (e.target.files[0]) handleFile(e.target.files[0]);
            };
            
            function handleFile(file) {
                const allowedTypes = ['image/jpeg', 'image/jpg', 'image/png', 'image/webp', 'image/gif'];
                if (!allowedTypes.includes(file.type)) {
                    showToast('Formato no permitido', 'warning');
                    return;
                }
                if (file.size > 2 * 1024 * 1024) {
                    showToast('La imagen no debe superar los 2MB', 'warning');
                    return;
                }
                
                selectedFile = file;
                
                // Mostrar preview
                const reader = new FileReader();
                reader.onload = (e) => {
                    previewUrl = e.target.result;
                    previewDiv.innerHTML = `<img src="${previewUrl}" style="max-width: 100%; max-height: 150px; border-radius: 8px; border: 1px solid var(--bdr);">`;
                };
                reader.readAsDataURL(file);
                
                uploadBtn.disabled = false;
                showToast('Imagen seleccionada', 'success');
            }
            
            // Eliminar imagen actual
            const removeCurrentBtn = document.getElementById('removeCurrentBtn');
            if (removeCurrentBtn) {
                removeCurrentBtn.onclick = () => {
                    if (confirm('¿Eliminar la imagen actual?')) {
                        onSuccess(null); // null indica eliminar
                        closeModal();
                    }
                };
            }
            
            // Subir
            uploadBtn.onclick = async () => {
                if (!selectedFile) return;
                
                uploadBtn.disabled = true;
                uploadBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Subiendo...';
                progressBar.style.display = 'block';
                
                // Simular progreso
                let progress = 0;
                const interval = setInterval(() => {
                    progress += 10;
                    if (progress <= 90) {
                        progressFill.style.width = progress + '%';
                    }
                }, 50);
                
                const imageUrl = await uploadImage(selectedFile, 'admin-uploads');
                
                clearInterval(interval);
                progressFill.style.width = '100%';
                
                if (imageUrl) {
                    setTimeout(() => {
                        onSuccess(imageUrl);
                        closeModal();
                        showToast('Imagen subida correctamente', 'success');
                    }, 500);
                } else {
                    uploadBtn.disabled = false;
                    uploadBtn.innerHTML = 'Subir y Guardar';
                    progressBar.style.display = 'none';
                    progressFill.style.width = '0%';
                    showToast('Error al subir la imagen', 'error');
                }
            };
            
            document.getElementById('closeModalBtn')?.addEventListener('click', closeModal);
            document.getElementById('cancelModalBtn')?.addEventListener('click', closeModal);
        }

            const progressFill = document.getElementById('uploadProgressFill');
            
            // Subir imagen
            uploadArea.onclick = () => fileInput.click();
            fileInput.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                progressBar.style.display = 'block';
                let progress = 0;
                const interval = setInterval(() => {
                    progress += 10;
                    if (progress <= 90) progressFill.style.width = progress + '%';
                }, 50);
                
                const imageUrl = await uploadImage(file, 'catalogos');
                clearInterval(interval);
                
                if (imageUrl) {
                    uploadedImageUrl = imageUrl;
                    progressFill.style.width = '100%';
                    setTimeout(() => {
                        progressBar.style.display = 'none';
                        progressFill.style.width = '0%';
                        previewDiv.innerHTML = `<img src="${imageUrl}" style="width: 80px; height: 80px; object-fit: cover; border-radius: 8px;"><div class="remove-preview" id="removeImageBtn"><i class="fas fa-times"></i></div>`;
                        document.getElementById('removeImageBtn')?.addEventListener('click', () => {
                            uploadedImageUrl = '';
                            previewDiv.innerHTML = '';
                        });
                        showToast('Imagen subida', 'success');
                    }, 500);
                } else {
                    progressBar.style.display = 'none';
                    progressFill.style.width = '0%';
                    showToast('Error al subir imagen', 'error');
                }
            };
            
            const closeModal = () => document.getElementById('catalogoModal')?.remove();
            document.getElementById('closeModalBtn')?.addEventListener('click', closeModal);
            document.getElementById('cancelModalBtn')?.addEventListener('click', closeModal);
            
            if (document.getElementById('removeImageBtn')) {
                document.getElementById('removeImageBtn').onclick = () => {
                    uploadedImageUrl = '';
                    previewDiv.innerHTML = '';
                };
            }
            
            document.getElementById('saveCatalogoBtn').onclick = async () => {
                const name = document.getElementById('catName').value.trim();
                const category = document.getElementById('catCategory').value.trim();
                const link = document.getElementById('catLink').value.trim();
                const descripcion = document.getElementById('catDesc').value.trim();
                
                if (!name || !category || !link) {
                    showToast('Complete los campos requeridos', 'warning');
                    return;
                }
                
                if (!uploadedImageUrl && !isEdit) {
                    showToast('Debe seleccionar una imagen', 'warning');
                    return;
                }
                
                const url = isEdit ? `${API}/api/catalogos/${cat.id}` : `${API}/api/catalogos`;
                const method = isEdit ? 'PUT' : 'POST';
                
                try {
                    const res = await fetch(url, {
                        method,
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            name, category, link, 
                            image: uploadedImageUrl || cat?.image, 
                            descripcion 
                        })
                    });
                    if (res.ok) {
                        showToast(isEdit ? 'Actualizado' : 'Agregado', 'success');
                        closeModal();
                        await loadData();
                    } else {
                        showToast('Error al guardar', 'error');
                    }
                } catch (error) {
                    showToast('Error de conexión', 'error');
                }
            };
        }
        
        // ============================================
        // HERO IMAGES (con input file)
        // ============================================
        function renderHero(container) {
            const images = data.acercade.hero_images || [];
            let html = `<div style="margin-bottom: 1rem;"><button class="btn btn-primary" id="addHeroImageBtn"><i class="fas fa-plus"></i> Agregar Imagen</button></div>`;
            html += `<div class="hero-images-grid">`;
            images.forEach((img, idx) => {
                html += `
                    <div class="hero-image-card">
                        <img src="${escapeHtml(img)}" alt="Hero ${idx + 1}">
                        <div class="hero-image-overlay">
                            <button class="btn btn-danger btn-sm delete-hero" data-index="${idx}"><i class="fas fa-trash"></i> Eliminar</button>
                        </div>
                    </div>
                `;
            });
            html += `
                <div class="add-image-card" id="addHeroImageCard">
                    <i class="fas fa-plus"></i>
                    <span>Agregar imagen</span>
                </div>
            </div>`;
            container.innerHTML = html;
            
            const saveHeroImages = async (newImages) => {
                try {
                    await fetch(API + '/api/acercade', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ hero_images: newImages })
                    });
                    await loadData();
                    showToast('Imágenes actualizadas', 'success');
                } catch (error) {
                    showToast('Error al guardar', 'error');
                }
            };
            
            document.querySelectorAll('.delete-hero').forEach(btn => {
                btn.onclick = () => {
                    const idx = parseInt(btn.dataset.index);
                    const newImages = [...images];
                    newImages.splice(idx, 1);
                    saveHeroImages(newImages);
                };
            });
            
            const addImage = () => {
                showImageUploadModal(async (imageUrl) => {
                    if (imageUrl) {
                        saveHeroImages([...images, imageUrl]);
                    }
                });
            };
            document.getElementById('addHeroImageBtn')?.addEventListener('click', addImage);
            document.getElementById('addHeroImageCard')?.addEventListener('click', addImage);
        }
        
        // ============================================
        // MISIÓN Y VISIÓN
        // ============================================
        function renderMisionVision(container) {
            const items = data.acercade.mision_vision || [{ titulo: 'Misión', descripcion: '', icono: 'fa-rocket' }, { titulo: 'Visión', descripcion: '', icono: 'fa-eye' }];
            renderGenericList(container, items, 'mision_vision', ['Título', 'Descripción', 'Icono (clase FontAwesome)'], ['titulo', 'descripcion', 'icono']);
        }
        
        // ============================================
        // VALORES
        // ============================================
        function renderValores(container) {
            const items = data.acercade.valores || [];
            renderGenericList(container, items, 'valores', ['Título', 'Descripción', 'Icono'], ['titulo', 'descripcion', 'icono']);
        }
        
        // ============================================
        // HISTORIA
        // ============================================
        function renderHistoria(container) {
            const items = data.acercade.historia || [];
            renderGenericList(container, items, 'historia', ['Año', 'Título', 'Descripción'], ['anio', 'titulo', 'descripcion']);
        }
        
        // ============================================
        // ESTADÍSTICAS
        // ============================================
        function renderEstadisticas(container) {
            const items = data.acercade.estadisticas || [];
            renderGenericList(container, items, 'estadisticas', ['Número', 'Sufijo (+, %, etc)', 'Etiqueta'], ['numero', 'sufijo', 'etiqueta']);
        }
        
        // ============================================
        // RENDER LISTA GENÉRICA
        // ============================================
        function renderGenericList(container, items, fieldName, labels, keys) {
            let html = `<div style="margin-bottom: 1rem;"><button class="btn btn-primary" id="addItemBtn"><i class="fas fa-plus"></i> Agregar ${labels[0]}</button></div>`;
            
            if (!items.length) {
                html += `<div class="content-card empty-state"><i class="fas fa-inbox"></i><h4>Sin elementos</h4><p>Agrega tu primer elemento</p></div>`;
            } else {
                html += `<div class="items-grid">`;
                items.forEach((item, idx) => {
                    html += `
                        <div class="item-card" data-index="${idx}">
                            <div class="item-header">
                                <span>#${idx + 1}</span>
                                <div>
                                    <button class="btn btn-secondary btn-sm edit-item" data-index="${idx}"><i class="fas fa-edit"></i> Editar</button>
                                    <button class="btn btn-danger btn-sm delete-item" data-index="${idx}"><i class="fas fa-trash"></i> Eliminar</button>
                                </div>
                            </div>
                            <div class="item-body">
                    `;
                    keys.forEach((key, i) => {
                        html += `<div class="form-group"><strong>${labels[i]}:</strong> ${escapeHtml(item[key] || '-')}</div>`;
                    });
                    html += `</div></div>`;
                });
                html += `</div>`;
            }
            
            container.innerHTML = html;
            
            const saveItems = async (newItems) => {
                try {
                    await fetch(API + '/api/acercade', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ [fieldName]: newItems })
                    });
                    await loadData();
                    showToast('Guardado correctamente', 'success');
                } catch (error) {
                    showToast('Error al guardar', 'error');
                }
            };
            
            document.getElementById('addItemBtn')?.addEventListener('click', () => {
                const newItem = {};
                keys.forEach(key => newItem[key] = '');
                showItemModal(items, newItem, saveItems, labels, keys, fieldName, -1);
            });
            
            document.querySelectorAll('.edit-item').forEach(btn => {
                btn.addEventListener('click', () => {
                    const idx = parseInt(btn.dataset.index);
                    showItemModal(items, { ...items[idx] }, saveItems, labels, keys, fieldName, idx);
                });
            });
            
            document.querySelectorAll('.delete-item').forEach(btn => {
                btn.addEventListener('click', () => {
                    const idx = parseInt(btn.dataset.index);
                    if (confirm('¿Eliminar este elemento?')) {
                        const newItems = items.filter((_, i) => i !== idx);
                        saveItems(newItems);
                    }
                });
            });
        }
        
        function showItemModal(items, item, saveCallback, labels, keys, fieldName, editIndex) {
            const isEdit = editIndex >= 0;
            let modalHtml = `
                <div class="modal show" id="itemModal">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h3>${isEdit ? 'Editar' : 'Agregar'} ${labels[0]}</h3>
                            <button class="btn btn-secondary btn-icon" id="closeModalBtn"><i class="fas fa-times"></i></button>
                        </div>
                        <div class="modal-body">
            `;
            keys.forEach((key, i) => {
                modalHtml += `<div class="form-group"><label class="form-label">${labels[i]}</label><input type="text" id="field_${key}" class="form-input" value="${escapeHtml(item[key] || '')}"></div>`;
            });
            modalHtml += `
                        </div>
                        <div class="modal-footer">
                            <button class="btn btn-secondary" id="cancelModalBtn">Cancelar</button>
                            <button class="btn btn-primary" id="saveItemBtn">Guardar</button>
                        </div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
            
            const closeModal = () => document.getElementById('itemModal')?.remove();
            document.getElementById('closeModalBtn')?.addEventListener('click', closeModal);
            document.getElementById('cancelModalBtn')?.addEventListener('click', closeModal);
            
            document.getElementById('saveItemBtn').onclick = () => {
                const newItem = {};
                keys.forEach(key => {
                    newItem[key] = document.getElementById(`field_${key}`)?.value.trim() || '';
                });
                const newItems = [...items];
                if (isEdit) {
                    newItems[editIndex] = newItem;
                } else {
                    newItems.push(newItem);
                }
                saveCallback(newItems);
                closeModal();
            };
        }
        
        // ============================================
        // EQUIPO (con input file para imagen)
        // ============================================
        function renderEquipo(container) {
            const miembros = data.acercade.equipo || [];
            let html = `<div style="margin-bottom: 1rem;"><button class="btn btn-primary" id="addMiembroBtn"><i class="fas fa-plus"></i> Agregar Miembro</button></div>`;
            
            if (!miembros.length) {
                html += `<div class="content-card empty-state"><i class="fas fa-users"></i><h4>Sin miembros</h4><p>Agrega los miembros del equipo</p></div>`;
            } else {
                html += `<div class="team-grid">`;
                miembros.forEach((m, idx) => {
                    html += `
                        <div class="team-card">
                            <img class="team-image" src="${escapeHtml(m.imagen || '')}" alt="${escapeHtml(m.nombre)}" onerror="this.src='https://placehold.co/400x200/1e293b/64748b?text=Sin+imagen'" style="cursor: pointer;">
                            <div class="team-info">
                                <div class="form-group"><strong>Nombre:</strong> ${escapeHtml(m.nombre || '-')}</div>
                                <div class="form-group"><strong>Cargo:</strong> ${escapeHtml(m.cargo || '-')}</div>
                                <div class="form-group"><strong>Descripción:</strong> ${escapeHtml(m.descripcion || '-')}</div>
                                ${m.linkedin ? `<div class="form-group"><strong>LinkedIn:</strong> <a href="${escapeHtml(m.linkedin)}" target="_blank">Ver perfil</a></div>` : ''}
                                ${m.github ? `<div class="form-group"><strong>GitHub:</strong> <a href="${escapeHtml(m.github)}" target="_blank">Ver perfil</a></div>` : ''}
                                <div style="display: flex; gap: 0.5rem; margin-top: 0.75rem;">
                                    <button class="btn btn-secondary btn-sm edit-miembro" data-index="${idx}"><i class="fas fa-edit"></i> Editar</button>
                                    <button class="btn btn-danger btn-sm delete-miembro" data-index="${idx}"><i class="fas fa-trash"></i> Eliminar</button>
                                </div>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
            }
            container.innerHTML = html;
            
            const saveEquipo = async (newEquipo) => {
                try {
                    await fetch(API + '/api/acercade', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ equipo: newEquipo })
                    });
                    await loadData();
                    showToast('Equipo actualizado', 'success');
                } catch (error) {
                    showToast('Error al guardar', 'error');
                }
            };
            
            document.getElementById('addMiembroBtn')?.addEventListener('click', () => showEquipoModal(miembros, null, saveEquipo));
            document.querySelectorAll('.edit-miembro').forEach(btn => {
                btn.addEventListener('click', () => {
                    const idx = parseInt(btn.dataset.index);
                    showEquipoModal(miembros, { ...miembros[idx], index: idx }, saveEquipo);
                });
            });
            document.querySelectorAll('.delete-miembro').forEach(btn => {
                btn.addEventListener('click', () => {
                    const idx = parseInt(btn.dataset.index);
                    if (confirm('¿Eliminar este miembro?')) {
                        const newEquipo = miembros.filter((_, i) => i !== idx);
                        saveEquipo(newEquipo);
                    }
                });
            });
            
            // Click en imagen para cambiarla
            document.querySelectorAll('.team-image').forEach((img, idx) => {
                img.onclick = () => {
                    showImageUploadModal(async (imageUrl) => {
                        if (imageUrl) {
                            const newEquipo = [...miembros];
                            newEquipo[idx].imagen = imageUrl;
                            await saveEquipo(newEquipo);
                        }
                    }, miembros[idx]?.imagen);
                };
            });
        }
        
        function showEquipoModal(miembros, miembro, saveCallback) {
            const isEdit = !!miembro;
            const editIndex = miembro?.index;
            let uploadedImageUrl = miembro?.imagen || '';
            
            const modalHtml = `
                <div class="modal show" id="equipoModal">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h3>${isEdit ? 'Editar' : 'Agregar'} Miembro del Equipo</h3>
                            <button class="btn btn-secondary btn-icon" id="closeModalBtn"><i class="fas fa-times"></i></button>
                        </div>
                        <div class="modal-body">
                            <div class="form-group"><label class="form-label">Nombre *</label><input type="text" id="eqNombre" class="form-input" value="${escapeHtml(miembro?.nombre || '')}"></div>
                            <div class="form-group"><label class="form-label">Cargo</label><input type="text" id="eqCargo" class="form-input" value="${escapeHtml(miembro?.cargo || '')}"></div>
                            <div class="form-group"><label class="form-label">Descripción</label><textarea id="eqDesc" class="form-input" rows="3">${escapeHtml(miembro?.descripcion || '')}</textarea></div>
                            <div class="form-group"><label class="form-label">Imagen</label>
                                <div class="upload-area" id="imageUploadArea" style="padding: 0.75rem;">
                                    <i class="fas fa-cloud-upload-alt"></i>
                                    <p>Haz clic para subir imagen</p>
                                </div>
                                <input type="file" id="eqImageFile" accept="image/*" style="display: none;">
                                <div id="eqImagePreview" class="image-preview" style="margin-top: 0.5rem;">
                                    ${miembro?.imagen ? `<img src="${escapeHtml(miembro.imagen)}" style="width: 80px; height: 80px; object-fit: cover; border-radius: 8px;"><div class="remove-preview" id="removeImageBtn"><i class="fas fa-times"></i></div>` : ''}
                                </div>
                                <div class="progress-bar" id="uploadProgress" style="display: none;"><div class="progress-bar-fill" id="uploadProgressFill"></div></div>
                            </div>
                            <div class="form-row">
                                <div class="form-group"><label class="form-label">LinkedIn (URL)</label><input type="url" id="eqLinkedin" class="form-input" value="${escapeHtml(miembro?.linkedin || '')}"></div>
                                <div class="form-group"><label class="form-label">GitHub (URL)</label><input type="url" id="eqGithub" class="form-input" value="${escapeHtml(miembro?.github || '')}"></div>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button class="btn btn-secondary" id="cancelModalBtn">Cancelar</button>
                            <button class="btn btn-primary" id="saveEquipoBtn">Guardar</button>
                        </div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
            
            // Subir imagen
            const uploadArea = document.getElementById('imageUploadArea');
            const fileInput = document.getElementById('eqImageFile');
            const previewDiv = document.getElementById('eqImagePreview');
            const progressBar = document.getElementById('uploadProgress');
            const progressFill = document.getElementById('uploadProgressFill');
            
            uploadArea.onclick = () => fileInput.click();
            fileInput.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                progressBar.style.display = 'block';
                let progress = 0;
                const interval = setInterval(() => {
                    progress += 10;
                    if (progress <= 90) progressFill.style.width = progress + '%';
                }, 50);
                
                const imageUrl = await uploadImage(file, 'team');
                clearInterval(interval);
                
                if (imageUrl) {
                    uploadedImageUrl = imageUrl;
                    progressFill.style.width = '100%';
                    setTimeout(() => {
                        progressBar.style.display = 'none';
                        progressFill.style.width = '0%';
                        previewDiv.innerHTML = `<img src="${imageUrl}" style="width: 80px; height: 80px; object-fit: cover; border-radius: 8px;"><div class="remove-preview" id="removeImageBtn"><i class="fas fa-times"></i></div>`;
                        document.getElementById('removeImageBtn')?.addEventListener('click', () => {
                            uploadedImageUrl = '';
                            previewDiv.innerHTML = '';
                        });
                        showToast('Imagen subida', 'success');
                    }, 500);
                } else {
                    progressBar.style.display = 'none';
                    progressFill.style.width = '0%';
                    showToast('Error al subir imagen', 'error');
                }
            };
            
            const closeModal = () => document.getElementById('equipoModal')?.remove();
            document.getElementById('closeModalBtn')?.addEventListener('click', closeModal);
            document.getElementById('cancelModalBtn')?.addEventListener('click', closeModal);
            
            if (document.getElementById('removeImageBtn')) {
                document.getElementById('removeImageBtn').onclick = () => {
                    uploadedImageUrl = '';
                    previewDiv.innerHTML = '';
                };
            }
            
            document.getElementById('saveEquipoBtn').onclick = () => {
                const newMiembro = {
                    nombre: document.getElementById('eqNombre')?.value.trim() || '',
                    cargo: document.getElementById('eqCargo')?.value.trim() || '',
                    descripcion: document.getElementById('eqDesc')?.value.trim() || '',
                    imagen: uploadedImageUrl || miembro?.imagen || '',
                    linkedin: document.getElementById('eqLinkedin')?.value.trim() || '',
                    github: document.getElementById('eqGithub')?.value.trim() || ''
                };
                if (!newMiembro.nombre) {
                    showToast('El nombre es requerido', 'warning');
                    return;
                }
                let newEquipo = [...miembros];
                if (isEdit && editIndex !== undefined) {
                    newEquipo[editIndex] = newMiembro;
                } else {
                    newEquipo.push(newMiembro);
                }
                saveCallback(newEquipo);
                closeModal();
            };
        }
        
        // ============================================
        // CONTACTOS
        // ============================================
        function renderContactos(container) {
            let html = `<div class="items-grid">`;
            if (!data.contactos.length) {
                html += `<div class="content-card empty-state"><i class="fas fa-inbox"></i><h4>Sin mensajes</h4></div>`;
            } else {
                data.contactos.forEach(cont => {
                    html += `
                        <div class="item-card">
                            <div class="item-header">
                                <span>${escapeHtml(cont.nombre)}</span>
                                <button class="btn btn-danger btn-sm delete-contacto" data-id="${cont.id}"><i class="fas fa-trash"></i> Eliminar</button>
                            </div>
                            <div class="item-body">
                                <div class="form-group"><strong>Teléfono:</strong> ${escapeHtml(cont.telefono)}</div>
                                <div class="form-group"><strong>Email:</strong> ${escapeHtml(cont.email || '-')}</div>
                                <div class="form-group"><strong>Mensaje:</strong> ${escapeHtml(cont.mensaje)}</div>
                                <div class="form-group"><strong>Fecha:</strong> ${escapeHtml(cont.fecha || '-')}</div>
                            </div>
                        </div>
                    `;
                });
            }
            html += `</div>`;
            container.innerHTML = html;
            
            document.querySelectorAll('.delete-contacto').forEach(btn => {
                btn.onclick = async () => {
                    const id = parseInt(btn.dataset.id);
                    if (confirm('¿Eliminar este mensaje?')) {
                        await fetch(`${API}/api/contactos/${id}`, { method: 'DELETE' });
                        showToast('Mensaje eliminado', 'success');
                        await loadData();
                    }
                };
            });
        }
        
        // ============================================
        // PEDIDOS
        // ============================================
        function renderPedidos(container) {
            let html = `<div class="items-grid">`;
            if (!data.pedidos.length) {
                html += `<div class="content-card empty-state"><i class="fas fa-shopping-bag"></i><h4>Sin pedidos</h4></div>`;
            } else {
                data.pedidos.forEach(ped => {
                    const estadoClass = ped.estado === 'Completado' ? 'var(--ok)' : ped.estado === 'Cancelado' ? 'var(--err)' : 'var(--warn)';
                    html += `
                        <div class="item-card">
                            <div class="item-header">
                                <span>Pedido #${ped.id}</span>
                                <button class="btn btn-danger btn-sm delete-pedido" data-id="${ped.id}"><i class="fas fa-trash"></i> Eliminar</button>
                            </div>
                            <div class="item-body">
                                <div class="form-row">
                                    <div class="form-group"><strong>Cliente:</strong> ${escapeHtml(ped.cliente)}</div>
                                    <div class="form-group"><strong>Teléfono:</strong> ${escapeHtml(ped.telefono)}</div>
                                </div>
                                <div class="form-group"><strong>Producto:</strong> ${escapeHtml(ped.producto)}</div>
                                <div class="form-group"><strong>Detalles:</strong> ${escapeHtml(ped.detalles || '-')}</div>
                                <div class="form-row">
                                    <div class="form-group"><strong>Estado:</strong> <span style="color: ${estadoClass}">${escapeHtml(ped.estado || 'Pendiente')}</span></div>
                                    <div class="form-group"><strong>Fecha:</strong> ${escapeHtml(ped.fecha || '-')}</div>
                                </div>
                            </div>
                        </div>
                    `;
                });
            }
            html += `</div>`;
            container.innerHTML = html;
            
            document.querySelectorAll('.delete-pedido').forEach(btn => {
                btn.onclick = async () => {
                    const id = parseInt(btn.dataset.id);
                    if (confirm('¿Eliminar este pedido?')) {
                        await fetch(`${API}/api/pedidos/${id}`, { method: 'DELETE' });
                        showToast('Pedido eliminado', 'success');
                        await loadData();
                    }
                };
            });
        }
        
        // ============================================
        // INICIALIZACIÓN
        // ============================================
        function initMobileMenu() {
            const menuToggle = document.getElementById('menuToggle');
            const sidebar = document.getElementById('sidebar');
            menuToggle?.addEventListener('click', () => {
                sidebar?.classList.toggle('open');
            });
        }
        
        function initRefresh() {
            document.getElementById('refreshBtn')?.addEventListener('click', () => {
                loadData();
                showToast('Actualizando datos...', 'info');
            });
        }
        
        async function init() {
            initTheme();
            initMobileMenu();
            initRefresh();
            await initSupabase();
            checkAuth();
        }
        
        init();
    })();
    </script>
</body>
</html>
